[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfo-official"
version = "0.1.0"
description = "Continuous Flow Operator research code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"einops==0.8.0",
	"flax==0.10.1",
	"h5py==3.12.1",
	"jax==0.4.36",
	"jaxlib==0.4.36",
	"numpy==1.26.1",
	"optax==0.2.3",
	"orbax-checkpoint==0.8.0",
	"scipy==1.14.1",
	"tensorflow==2.18.0",
	"tqdm==4.66.6",
	"wandb==0.19.9",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "utils*"]
